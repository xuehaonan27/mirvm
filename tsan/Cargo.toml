[package]
name = "mirvm-tsan"
version = "0.0.1"
edition = "2024"
publish = false

# Standalone crate (explicitly opts out of any enclosing workspace): the mirvm
# main binary links rustc_private dynamic libraries (uninstrumented, with its own
# allocator), so it cannot be built under TSan as a whole; src/vm is pure Rust and
# is reused source-for-source via #[path].
[workspace]

[dependencies]
blake3 = "1.8"
libc = "0.2"
libffi = "5.1.1"
libmimalloc-sys = "0.1.49"
# Every type in ir.rs carries a serde derive (the L2 cache); the harness compiles
# src/vm source-for-source via #[path], so its dependency surface must keep up.
serde = { version = "1.0.228", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
memmap2 = "0.2.3"

[profile.release]
debug = true # TSan reports carry symbols
