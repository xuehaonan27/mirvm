[package]
name = "mirvm-tsan"
version = "0.0.1"
edition = "2024"
publish = false

# 独立 crate（显式退出任何上层 workspace）：mirvm 主二进制链接 rustc_private 动态库
# （未插桩 + 自带分配器），不能整体上 TSan；src/vm 是纯 Rust，经 #[path] 同源复用。
[workspace]

[dependencies]
blake3 = "1.8"
libc = "0.2"
libffi = "5.1.1"
libmimalloc-sys = "0.1.49"
# ir.rs 全类型带 serde derive（M6 片2 L2 缓存）；harness 经 #[path] 同源编译 src/vm，
# 依赖面必须跟上（M5.2 f16/f128 feature 同教训）
serde = { version = "1.0.228", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
memmap2 = "0.2.3"

[profile.release]
debug = true # TSan 报告带符号
