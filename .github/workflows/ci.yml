name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      # Shared runners are too small for the full corpus and the shared target dir must stay
      # bounded: the budget gate clears it past 12G (see tests/lib/harness.sh).
      MIRVM_TARGET_BUDGET_GB: "12"
    steps:
      - uses: actions/checkout@v4

      # strace and ripgrep are required: five contract suites audit syscalls, and the
      # runtime suites use ripgrep to assert on diagnostics. Missing them is an
      # environment error, not a SKIP.
      - name: Install native dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          binutils build-essential libffi-dev ripgrep strace

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install nightly-2026-07-02 --profile minimal
          --component rustc-dev --component rust-src --component llvm-tools
          --component rustfmt --component clippy

      # Static first: a manifest typo or an unjustified asset should not cost a release build.
      - name: Test inventory
        run: make validate inventory

      # make test = quality.rust (fmt, clippy, cargo test) + the program/Cargo/cargoless
      # differentials + the cargoless and pack contracts + harness.truth.
      - name: Fast gate
        run: make test

      - name: ThreadSanitizer
        run: make case C=tsan

      # CI stops here on purpose. `smoke` and `gate` add the corpus (real dependency
      # trees that cost minutes each, with 300-400s per-driver timeouts) and the
      # timing gates; both need a machine far larger than a shared runner, so they
      # remain a local/release activity rather than a step that always times out.
