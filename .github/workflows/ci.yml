name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y binutils build-essential libffi-dev

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install nightly-2026-07-02 --profile minimal
          --component rustc-dev --component rust-src --component llvm-tools
          --component rustfmt --component clippy

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --locked --all-features

      - name: Gate harness regression tests
        run: bash tests/gate_truth_regression.sh

      - name: Release build
        run: cargo build --release --locked

      - name: ThreadSanitizer gate
        run: bash tests/spike4_tsan.sh

      - name: Runtime differential gates
        env:
          SKIP_PERF: "1"
          # TSan has its own visible step above; gate must report this as SKIP.
          SKIP_TSAN: "1"
          # CI runners have limited disk: the shared target dir is auto-cleared
          # past 12G (the budget gate in tests/lib.sh).
          MIRVM_TARGET_BUDGET_GB: "12"
        # gate.sh = the full corpus defense (manifest) + four-state diff +
        # diff_cargo + perf + a2 + probes + runtime_gates + JIT stats;
        # defaults to target/release
        run: bash tests/gate.sh
