name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y binutils build-essential libffi-dev

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install nightly-2026-07-02 --profile minimal
          --component rustc-dev --component rust-src --component llvm-tools
          --component rustfmt --component clippy

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --locked --all-features

      - name: Gate harness regression tests
        run: bash tests/gate_truth_regression.sh

      - name: Release build
        run: cargo build --release --locked

      - name: ThreadSanitizer gate
        run: bash tests/spike4_tsan.sh

      - name: Runtime differential gates
        env:
          SKIP_PERF: "1"
          # TSan has its own visible step above; gate5 must report this as SKIP.
          SKIP_TSAN: "1"
        # m5_gate6 内含 m4_gate5 全量 + M5.5 收口三查（§7 落笔/JIT stats/§7.20），
        # 默认 target/release（audit V-03 修正：性能/执行口径一律 release）
        run: bash tests/m5_gate6.sh
