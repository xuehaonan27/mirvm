[package]
name = "mirvm"
version = "0.0.1"
edition = "2024"
publish = false
default-run = "mirvm"

[features]
# cranelift: the real JIT backend. The tests/data/fixtures/tsan/ harness does not enable this feature,
# so it stays off the heavy dependency and the TSan channel is unaffected (an
# extension of the engine-core isolation discipline).
default = ["compiler", "cranelift"]
compiler = ["cli"]
cli = [
    "dep:toml",
    "dep:semver",
    "dep:pubgrub",
    "dep:version-ranges",
    "dep:ureq",
    "dep:flate2",
    "dep:tar",
]
cranelift = [
    "dep:cranelift-codegen",
    "dep:cranelift-frontend",
    "dep:cranelift-jit",
    "dep:cranelift-module",
    "dep:cranelift-native",
    "dep:gimli",
]

[[bin]]
name = "mirvm"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "mirvm-compiler"
path = "src/compiler_main.rs"
required-features = ["compiler"]

[[example]]
name = "runtime-runner"
path = "experiments/runtime-boundary/runner.rs"

[[example]]
name = "runtime-compiler"
path = "experiments/runtime-boundary/compiler.rs"
required-features = ["compiler"]

[dependencies]
blake3 = "1.8"
# Keep the cranelift family on one version; gimli is aligned with the one
# cranelift-codegen uses internally (the types interop).
cranelift-codegen = { version = "0.133.1", optional = true, features = ["unwind", "enable-serde"] }
cranelift-frontend = { version = "0.133.1", optional = true }
cranelift-jit = { version = "0.133.1", optional = true }
cranelift-module = { version = "0.133.1", optional = true }
cranelift-native = { version = "0.133.1", optional = true }
gimli = { version = "0.33", optional = true, default-features = false, features = ["write"] }
libc = "0.2.186"
libffi = "5"
libmimalloc-sys = "0.1.49"
postcard = { version = "1", default-features = false, features = ["use-std"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.150"
# Dependency resolution and build scheduling for the cargoless path (src/cargoless/).
toml = { optional = true, version = "1.1", features = ["serde", "preserve_order"] }
semver = { optional = true, version = "1.0.28", features = ["serde"] }
pubgrub = { version = "0.4", optional = true }
# version-ranges' semver module (Ranges::from_req) is not compiled by default;
# enable the feature explicitly to feature-unify with pubgrub's transitive dependency.
version-ranges = { optional = true, version = "0.1.3", features = ["semver"] }
ureq = { version = "3.3", optional = true }
flate2 = { version = "1.1", optional = true }
tar = { version = "0.4", optional = true }
# The error vocabulary: every mirvm failure class is a typed enum deriving thiserror.
thiserror = "2"
memmap2 = "0.2.3"
rkyv = { version = "0.7.46", features = ["validation"] }

[build-dependencies]
rustc_version = "0.4.1"

[dev-dependencies]
rustc_version = "0.4.1"

# Lets rust-analyzer see the rustc_private crates (enable
# rust-analyzer.rustc.source = "discover" on the IDE side).
[package.metadata.rust-analyzer]
rustc_private = true

# nightly-2026-07-02 / LLVM 22 miscompiles the cleanup chain of a recursive
# interpreter panic in release builds without full DWARF; the catch/panic cases in
# tests/run.sh fast reproduce it reliably. Generating code with DWARF and stripping
# it afterwards keeps the unwind control flow correct without growing the artifact.
# The abort also follows codegen-unit packing (`open-issues.md` E35 records that it
# disappears under 256 units and not under 1), so the partition is stated here
# rather than left to whichever layout the current function set happens to produce.
[profile.release]
debug = 2
strip = "debuginfo"
codegen-units = 256
