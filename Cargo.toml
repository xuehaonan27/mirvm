[package]
name = "mirvm"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.103"
libc = "0.2.186"
rustc-build-sysroot = "0.5.13"
rustc_version = "0.4.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

# 让 rust-analyzer 认识 rustc_private crates（需在 IDE 端开启 rust-analyzer.rustc.source = "discover"）
[package.metadata.rust-analyzer]
rustc_private = true
